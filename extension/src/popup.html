<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebMCP Translator</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="logo-title">
        <span class="icon">🌐</span>
        <h1>WebMCP Translator</h1>
      </div>
      <span class="badge" id="slice-badge">Direct Mode</span>
    </header>

    <!-- Banners -->
    <div class="warning-banner" id="privacy-warning-banner">
      ⚠️ Văn bản trên trang sẽ được gửi tới 9router Base URL đã cấu hình.
    </div>

    <div class="error-banner" id="key-access-banner" role="alert" style="display: none; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.35); border-left: 3px solid #ef4444; color: #fca5a5; font-size: 11.5px; padding: 8px 10px; border-radius: 8px; line-height: 1.4;">
      🚨 [KEY_ACCESS_UNAVAILABLE] Lỗi bảo mật bộ nhớ extension. Không thể thiết lập TRUSTED_CONTEXTS.
    </div>

    <!-- Status section (Telemtry Card) -->
    <section class="section status-card" aria-labelledby="status-header-label">
      <div class="status-header">
        <span class="status-label" id="status-header-label">Trạng thái:</span>
        <span class="status-val" id="status-text">Đang tải...</span>
      </div>
      <div class="status-sub" id="status-detail"></div>
    </section>

    <!-- Consent section -->
    <section class="section consent-card" id="consent-card" aria-label="Cài đặt quyền dịch trang">
      <div class="consent-header">
        <span class="consent-title">Quyền dịch</span>
        <span class="site-origin-badge" id="site-origin-badge">--</span>
      </div>
      <div class="consent-row">
        <label class="consent-toggle-label" for="toggle-site-consent">
          <input type="checkbox" id="toggle-site-consent" aria-label="Bật dịch cho site này" />
          <span class="toggle-text" id="toggle-site-consent-text">Bật dịch cho site này</span>
        </label>
      </div>
      <div class="consent-row tab-override-row">
        <span class="override-label">Tab này:</span>
        <div class="btn-group-override" role="group" aria-label="Tab consent override">
          <button type="button" class="btn-override active" id="btn-override-inherit" data-val="inherit" title="Theo cài đặt site" aria-label="Theo cài đặt site">Theo site</button>
          <button type="button" class="btn-override" id="btn-override-on" data-val="on" title="Bật tab này" aria-label="Bật tab này">Bật tab này</button>
          <button type="button" class="btn-override" id="btn-override-off" data-val="off" title="Tắt tab này" aria-label="Tắt tab này">Tắt tab này</button>
        </div>
      </div>
    </section>

    <!-- Actions (Translate / Restore) -->
    <section class="section actions-card" aria-label="Hành động dịch">
      <button id="btn-translate" class="btn btn-primary" title="Dịch trang này" aria-label="Dịch trang này" disabled>
        ▶ Dịch trang này
      </button>
      <button id="btn-restore" class="btn btn-secondary" title="Khôi phục văn bản gốc" aria-label="Khôi phục văn bản gốc" disabled>
        ↺ Khôi phục gốc
      </button>
    </section>

    <!-- Tab Navigation -->
    <div class="tab-list" role="tablist" aria-label="Cài đặt translator">
      <button type="button" class="tab-btn active" role="tab" id="tab-models" aria-selected="true" aria-controls="tabpanel-models" tabindex="0">Model &amp; kết nối</button>
      <button type="button" class="tab-btn" role="tab" id="tab-general" aria-selected="false" aria-controls="tabpanel-general" tabindex="-1">Ngôn ngữ &amp; chế độ</button>
    </div>

    <!-- Tab 1: Model & kết nối -->
    <section class="section tab-panel" id="tabpanel-models" role="tabpanel" aria-labelledby="tab-models" tabindex="0">
      <div class="form-group">
        <label for="input-base-url">Base URL</label>
        <input type="text" id="input-base-url" placeholder="http://localhost:8080/v1" autocomplete="off" aria-label="Base URL của 9router" />
      </div>

      <div class="form-group">
        <label for="input-api-key">API Key</label>
        <div class="input-with-button">
          <input type="password" id="input-api-key" placeholder="Nhập API key" autocomplete="off" aria-label="API Key" />
          <button type="button" id="btn-toggle-key" class="btn-icon" title="Hiện hoặc ẩn API key" aria-label="Hiện hoặc ẩn API key">👁️</button>
        </div>
      </div>

      <div class="form-group">
        <label for="select-model">Primary Model</label>
        <div class="input-with-button">
          <select id="select-model" aria-label="Chọn primary model dịch">
            <optgroup label="Recommended">
              <option value="ag/gemini-3.1-pro-low" selected>ag/gemini-3.1-pro-low</option>
              <option value="do/glm-5.3-flash">do/glm-5.3-flash</option>
              <option value="do/deepseek-v4.1-flash">do/deepseek-v4.1-flash</option>
              <option value="ag/gemini-3.8-flash">ag/gemini-3.8-flash</option>
            </optgroup>
          </select>
          <button type="button" id="btn-toggle-favorite" class="btn-icon btn-star" title="Thêm/bỏ yêu thích model này" aria-label="Thêm hoặc bỏ model đang chọn khỏi danh sách yêu thích">☆</button>
          <button type="button" id="btn-refresh-models" class="btn-icon" title="Làm mới danh sách model" aria-label="Làm mới danh sách model">🔄</button>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group flex-1">
          <label for="select-fallback-1">Fallback 1</label>
          <select id="select-fallback-1" aria-label="Chọn fallback model 1">
            <option value="">-- Không chọn --</option>
          </select>
        </div>
        <div class="form-group flex-1">
          <label for="select-fallback-2">Fallback 2</label>
          <select id="select-fallback-2" aria-label="Chọn fallback model 2">
            <option value="">-- Không chọn --</option>
          </select>
        </div>
      </div>

      <div class="config-actions">
        <button id="btn-save-config" class="btn btn-sm btn-success" title="Lưu cấu hình kết nối &amp; model" aria-label="Lưu cấu hình kết nối và model">💾 Lưu kết nối &amp; model</button>
        <button id="btn-delete-key" class="btn btn-sm btn-danger" title="Xoá API key đã lưu" aria-label="Xoá API key đã lưu">🗑️ Xoá key</button>
      </div>
      <div id="config-message" class="config-message" aria-live="polite"></div>
    </section>

    <!-- Tab 2: Ngôn ngữ & chế độ -->
    <section class="section tab-panel hidden" id="tabpanel-general" role="tabpanel" aria-labelledby="tab-general" tabindex="0">
      <div class="form-row">
        <div class="form-group flex-1">
          <label for="select-src-lang">Nguồn</label>
          <select id="select-src-lang" aria-label="Ngôn ngữ nguồn">
            <option value="auto">Tự động (auto)</option>
            <option value="zh">Tiếng Trung (zh)</option>
            <option value="en">Tiếng Anh (en)</option>
            <option value="ja">Tiếng Nhật (ja)</option>
            <option value="ko">Tiếng Hàn (ko)</option>
          </select>
        </div>
        <div class="form-group flex-1">
          <label for="select-tgt-lang">Đích</label>
          <select id="select-tgt-lang" aria-label="Ngôn ngữ đích">
            <option value="vi" selected>Tiếng Việt (vi)</option>
            <option value="en">Tiếng Anh (en)</option>
            <option value="zh">Tiếng Trung (zh)</option>
          </select>
        </div>
      </div>

      <div class="form-group" role="radiogroup" aria-label="Chế độ dịch">
        <label class="field-title">Chế độ dịch</label>
        <div class="radio-card">
          <label class="radio-label" for="mode-scroll">
            <input type="radio" id="mode-scroll" name="translation-mode" value="scroll-follow" checked />
            <div class="radio-content">
              <span class="radio-title">Dịch đuổi theo scroll <span class="badge-rec">Mặc định</span></span>
              <span class="radio-desc">Tự động phát hiện và dịch khi cuộn trang tới</span>
            </div>
          </label>
          <label class="radio-label" for="mode-full">
            <input type="radio" id="mode-full" name="translation-mode" value="full" />
            <div class="radio-content">
              <span class="radio-title">Dịch toàn bộ trang</span>
              <span class="radio-desc">Quét và dịch toàn bộ nội dung trong một lần</span>
            </div>
          </label>
        </div>
      </div>

      <div class="form-group checkbox-group">
        <label class="consent-toggle-label" for="checkbox-widget-visible">
          <input type="checkbox" id="checkbox-widget-visible" checked />
          <span class="toggle-text">Hiện icon nổi trên trang (Floating widget)</span>
        </label>
      </div>

      <div class="config-actions">
        <button id="btn-save-general" class="btn btn-sm btn-success" title="Lưu cài đặt ngôn ngữ &amp; chế độ" aria-label="Lưu cài đặt ngôn ngữ và chế độ">💾 Lưu chế độ</button>
      </div>
      <div id="config-message-general" class="config-message" aria-live="polite"></div>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <span>WebMCP Translator • </span>
      <span id="key-status-indicator">Key: Chưa lưu</span>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
